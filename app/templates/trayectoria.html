<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trayectoria IPF {{ ipf }}</title>
    <link rel="icon" href="/static/icon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&family=Source+Code+Pro:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
    <style>
        :root {
          --verde-dk:    #00815A;
          --verde-claro: #9BDAC5;
          --amarillo:    #F3CD00;
          --bg:          #F4F6F4;
          --bg2:         #FFFFFF;
          --border:      #C8DDD6;
          --text:        #1A2E26;
          --muted:       #7A9A8E;
          --header-h:    64px;
          --font:        'Nunito Sans', Calibri, sans-serif;
          --mono:        'Source Code Pro', 'Courier New', monospace;
        }
        * { box-sizing: border-box; }
        html, body { height: 100%; }
        body { font-family: var(--font); margin: 0; display: flex; flex-direction: column;
               height: 100vh; overflow: hidden; color: var(--text); background: var(--bg); }

        header { height: var(--header-h); min-height: var(--header-h); flex: none;
                 background: var(--verde-dk); display: flex; align-items: center;
                 padding: 0 1.25rem; gap: 0.75rem; box-shadow: 0 2px 8px rgba(0,0,0,0.18); }
        .logo { width: 36px; height: 36px; flex-shrink: 0; }
        .logo img { width: 100%; height: 100%; object-fit: contain; }
        .header-text h1 { color: #fff; font-size: 1.2rem; font-weight: 800; line-height: 1.2; margin: 0; }
        .header-text p { color: var(--verde-claro); font-size: 0.72rem; margin: 0.1rem 0 0; }
        .header-badges { margin-left: auto; display: flex; gap: 0.4rem; }
        .badge { border: 1px solid rgba(255,255,255,0.3); color: rgba(255,255,255,0.85);
                 border-radius: 12px; padding: 0.15rem 0.65rem; font-size: 0.65rem; font-weight: 600;
                 font-family: var(--mono); }

        main { flex: 1; display: flex; flex-direction: column; overflow: hidden; padding: 1rem; }
        .card { flex: 1; background: var(--bg2); border: 1px solid var(--border); border-radius: 10px;
                display: flex; flex-direction: column; overflow: hidden; padding: 1rem 1.1rem; }
        .card h2 { font-size: 0.95rem; font-weight: 800; color: var(--text); margin: 0 0 0.75rem;
                    padding-bottom: 0.5rem; border-bottom: 1px solid var(--border); }
        .card h2 span { color: var(--muted); font-weight: 600; font-family: var(--mono); font-size: 0.8rem; }

        /* Cabecera de persona (sexo/edad/nacionalidad): dato constante para todos
           los episodios, se muestra una sola vez, no por fila. */
        .persona { display: flex; gap: 1.2rem; font-size: 0.85rem; color: var(--text); margin: 0 0 0.8rem; }
        .persona b { color: var(--verde-dk); font-size: 1rem; }

        /* Tabla de episodios sincronizada en altura de fila con el Gantt de al
           lado - ver comentario equivalente en colectivos.html. align-items:
           flex-start es imprescindible: sin el, el "stretch" por defecto de
           flexbox fuerza a #gantt a la altura VISIBLE de #timeline (bug real
           encontrado con datos), en vez de dejarle su altura real calculada -
           Plotly, con {responsive:true}, se adapta a ese hueco mas pequenyo y
           encoge las barras, desalineandolas de la tabla cada vez mas segun
           se baja en la lista. */
        #timeline { flex: 1; display: flex; overflow: auto; align-items: flex-start; }
        #tabla-episodios { flex: none; font-family: var(--mono); font-size: 0.7rem; }
        .fila-episodio { display: grid; grid-template-columns: 2rem 3.2rem 8.5rem 8.5rem 2.8rem;
                           align-items: center; column-gap: 0.4rem; border-bottom: 1px solid var(--border); }
        .fila-episodio.cabecera-episodios { font-family: var(--font); font-weight: 700; color: var(--muted);
                                              font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.03em; }
        .fila-episodio span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        #gantt { flex: 1; min-height: 0; }
    </style>
</head>
<body>
    <header>
        <div class="logo"><img src="/static/icon.ico" alt=""></div>
        <div class="header-text">
            <h1>MCVL Analyser SEPE</h1>
            <p>Observatorio de las Ocupaciones · SEPE</p>
        </div>
        <div class="header-badges">
            <span class="badge">v1.3</span>
            <span class="badge">Trayectorias</span>
        </div>
    </header>

    <main>
        <div class="card">
            <h2>Trayectoria laboral &mdash; <span>IPF {{ ipf }}</span></h2>
            <div class="persona" id="persona"></div>
            <div id="timeline">
                <div id="tabla-episodios"></div>
                <div id="gantt"></div>
            </div>
        </div>
    </main>

    <script>
        const persona = {{ persona_json | safe }};
        const episodios = {{ episodios_json | safe }};
        // Fecha de corte de esta MCVL (no la fecha real de hoy): el dato esta
        // congelado a esa fecha, un episodio "todavia activo" (ep.fin nulo,
        // placeholder 2099 ya resuelto en el backend) se dibuja hasta ahi.
        const fechaCorte = "{{ fecha_corte }}";

        // persona.sexo ya llega como texto ("Hombre"/"Mujer"/"NO CONSTA") desde el backend -
        // se muestra tal cual, sin simbolo (♂/♀ no se veian bien).
        const edad = persona.edad != null ? Math.round(persona.edad) + ' años' : 'no disponible';
        document.getElementById('persona').innerHTML =
            `<span>Sexo: <b>${persona.sexo}</b></span><span>Edad: ${edad}</span><span>Nacionalidad: ${persona.nacionalidad ?? 'no disponible'}</span>`;

        // Alturas de fila compartidas por la tabla de episodios (HTML) y el
        // grafico Gantt (Plotly) de al lado, para que cada fila de texto quede
        // pegada a su barra.
        const ALTO_FILA_EPISODIO = 26;
        const ALTO_CABECERA_EPISODIOS = 24;
        const MARGEN_INFERIOR_GANTT = 40; // espacio para las fechas del eje X

        const filasHtml = episodios.map((ep, i) => `
            <div class="fila-episodio" style="height:${ALTO_FILA_EPISODIO}px" title="CCC ${ep.empresa}">
                <span>${i + 1}</span><span>${ep.provincia ?? '—'}</span><span>${ep.regimen}</span>
                <span>${ep.tipo_contrato}</span><span>${ep.trl ?? '—'}</span>
            </div>`).join('');
        document.getElementById('tabla-episodios').innerHTML = `
            <div class="fila-episodio cabecera-episodios" style="height:${ALTO_CABECERA_EPISODIOS}px">
                <span>Nº</span><span>Prov.</span><span>Régimen</span><span>Contrato</span><span>TRL</span>
            </div>${filasHtml}`;

        const traces = episodios.map((ep, i) => {
            const fila = String(i + 1);
            return {
                x: [ep.inicio, ep.fin || fechaCorte],
                y: [fila, fila],
                mode: "lines+markers",
                line: { width: 20, color: "#00815A" },
                marker: { size: 14, color: "#00815A" },
                name: fila,
                text: "CCC: " + ep.empresa +
                      "<br>Provincia: " + (ep.provincia ?? "?") +
                      "<br>Régimen: " + ep.regimen +
                      "<br>Contrato: " + ep.tipo_contrato +
                      "<br>TRL: " + (ep.trl ?? "?") +
                      "<br>Grupo cotización: " + (ep.grupo_cotizacion ?? "?"),
                hoverinfo: "text+x",
            };
        });

        // Sin titulo dentro de la figura y sin etiquetas en el eje Y (la tabla
        // de al lado ya muestra el numero de episodio) - ver comentario
        // equivalente en colectivos.html sobre el calculo de alturas. Altura
        // fijada explicitamente en el div (no solo en layout.height) y
        // "autorange:false" con range descendente en vez de "reversed" -
        // 2 bugs reales de Plotly encontrados con datos, ver comentario
        // extenso en dibujarGanttIndividual (colectivos.html).
        const alturaGantt = ALTO_CABECERA_EPISODIOS + episodios.length * ALTO_FILA_EPISODIO + MARGEN_INFERIOR_GANTT;
        document.getElementById("gantt").style.height = alturaGantt + "px";
        Plotly.newPlot("gantt", traces, {
            xaxis: { type: "date" },
            yaxis: {
                type: "category", autorange: false, showticklabels: false,
                range: [episodios.length - 0.5, -0.5],
            },
            margin: { l: 10, r: 20, t: ALTO_CABECERA_EPISODIOS, b: MARGEN_INFERIOR_GANTT },
            height: alturaGantt,
            showlegend: false,
            font: { family: "Nunito Sans, Calibri, sans-serif", color: "#1A2E26" },
            paper_bgcolor: "#FFFFFF",
            plot_bgcolor: "#FFFFFF",
        }, { displayModeBar: false, responsive: true });
    </script>
</body>
</html>
