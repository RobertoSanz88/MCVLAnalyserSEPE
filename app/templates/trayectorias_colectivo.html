<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCVL Analyser SEPE — Trayectorias de colectivo</title>
    <link rel="icon" href="/static/icon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&family=Source+Code+Pro:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
    <style>
        :root {
          --verde-dk:    #00815A;
          --verde-acc:   #04A06E;
          --verde-claro: #9BDAC5;
          --azul-marino: #154481;
          --bg:          #F4F6F4;
          --bg2:         #FFFFFF;
          --bg3:         #EDF3F0;
          --border:      #C8DDD6;
          --text:        #1A2E26;
          --muted:       #7A9A8E;
          --header-h:    64px;
          --font:        'Nunito Sans', Calibri, sans-serif;
          --mono:        'Source Code Pro', 'Courier New', monospace;
        }
        * { box-sizing: border-box; }
        html { font-size: 118.75%; }
        html, body { height: 100%; }
        body { font-family: var(--font); margin: 0; display: flex; flex-direction: column;
               height: 100vh; overflow: hidden; color: var(--text); background: var(--bg); }

        header { height: var(--header-h); min-height: var(--header-h); flex: none;
                 background: var(--verde-dk); display: flex; align-items: center;
                 padding: 0 1.25rem; gap: 0.75rem; box-shadow: 0 2px 8px rgba(0,0,0,0.18); }
        .logo { width: 36px; height: 36px; flex-shrink: 0; }
        .logo img { width: 100%; height: 100%; object-fit: contain; }
        .header-text h1 { color: #fff; font-size: 1.2rem; font-weight: 800; line-height: 1.2; margin: 0; }
        .header-text p { color: var(--verde-claro); font-size: 0.72rem; margin: 0.1rem 0 0; }
        .header-badges { margin-left: auto; display: flex; align-items: center; gap: 0.75rem; }
        .volver { color: rgba(255,255,255,0.85); font-size: 0.78rem; font-weight: 700; text-decoration: none; }
        .volver:hover { color: #fff; text-decoration: underline; }
        .badge { border: 1px solid rgba(255,255,255,0.3); color: rgba(255,255,255,0.85);
                 border-radius: 12px; padding: 0.15rem 0.65rem; font-size: 0.65rem; font-weight: 600; }

        main { flex: 1; display: flex; flex-direction: column; overflow: hidden; padding: 1rem; }

        /* --- Mensaje sin colectivo --- */
        #sin-colectivo { flex: 1; display: none; align-items: center; justify-content: center; }
        #sin-colectivo .caja { text-align: center; background: var(--bg2); border: 1px solid var(--border);
                                 border-radius: 10px; padding: 2rem 2.4rem; max-width: 420px; }
        #sin-colectivo p { color: var(--muted); font-size: 0.92rem; margin: 0 0 1rem; }
        #sin-colectivo a { display: inline-block; background: var(--verde-dk); color: #fff; text-decoration: none;
                             font-weight: 700; font-size: 0.85rem; padding: 0.55rem 1.1rem; border-radius: 7px; }
        #sin-colectivo a:hover { background: var(--verde-acc); }

        /* --- Contenido con colectivo --- */
        #con-colectivo { flex: 1; display: none; flex-direction: column; overflow: hidden; gap: 0.8rem; }

        /* Selector de tabla: mismo lenguaje visual que las pestanas del rail de
           /colectivos (activa = verde solido, deshabilitada = gris con nota
           "proximamente"), aqui en fila horizontal en vez de rail vertical. */
        .selector-tablas { display: flex; gap: 0.5rem; flex: none; }
        .pestana-tabla { padding: 0.55rem 1rem; border-radius: 7px; font-size: 0.85rem; font-weight: 700;
                           border: 1.5px solid var(--border); background: var(--bg2); color: var(--muted); }
        .pestana-tabla.activa { background: var(--verde-dk); color: #fff; border-color: var(--verde-dk); }
        .pestana-tabla.deshabilitada { color: var(--border); cursor: default; }
        .pestana-tabla .nota-futuro { display: block; font-size: 0.62rem; font-weight: 400; margin-top: 0.1rem; }

        .card { flex: 1; background: var(--bg2); border: 1px solid var(--border); border-radius: 10px;
                display: flex; flex-direction: column; overflow: hidden; padding: 1rem 1.1rem; }

        /* --- Recuentos / leyenda de subcolectivos (mismo patron que /colectivos) --- */
        #recuentos { display: flex; flex-wrap: wrap; gap: 0.5rem 1.4rem; margin-bottom: 0.9rem;
                     font-size: 0.75rem; color: var(--muted); font-weight: 600; flex: none; }
        #recuentos .item { display: flex; align-items: center; gap: 0.4rem; }
        #recuentos .swatch { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }
        #recuentos .n { font-family: var(--mono); color: var(--text); font-weight: 700; }

        /* --- Controles del grafico --- */
        .controles { display: flex; align-items: center; gap: 1.4rem; margin-bottom: 0.7rem; flex: none; }
        .controles label { font-size: 0.78rem; color: var(--muted); font-weight: 600; }
        .controles select { font-family: var(--font); font-size: 0.82rem; padding: 0.3rem 0.5rem;
                              border: 1.5px solid var(--border); border-radius: 5px; background: var(--bg);
                              color: var(--text); margin-left: 0.4rem; }
        .switch-vista { display: flex; border: 1.5px solid var(--border); border-radius: 7px; overflow: hidden; }
        .switch-vista button { border: none; border-radius: 0; padding: 0.3rem 0.75rem; font-size: 0.78rem;
                                 font-family: var(--font); font-weight: 700; background: var(--bg); color: var(--muted); }
        .switch-vista button.activa { background: var(--verde-dk); color: #fff; }

        #grafico-bases { flex: 1; min-height: 0; }
        .aviso-vacio { color: var(--muted); font-style: italic; font-size: 0.85rem; }
    </style>
</head>
<body>
    <header>
        <div class="logo"><img src="/static/icon.ico" alt=""></div>
        <div class="header-text">
            <h1>MCVL Analyser SEPE</h1>
            <p>Observatorio de las Ocupaciones · SEPE</p>
        </div>
        <div class="header-badges">
            <a class="volver" href="/colectivos">&larr; Análisis de colectivos</a>
            <span class="badge">v0.1</span>
            <span class="badge">Trayectorias de colectivo</span>
        </div>
    </header>

    <main>
        <div id="sin-colectivo">
            <div class="caja">
                <p>Selecciona un colectivo de estudio en Análisis de colectivos primero</p>
                <a href="/colectivos">Ir a Análisis de colectivos</a>
            </div>
        </div>

        <div id="con-colectivo">
            <div class="selector-tablas">
                <div class="pestana-tabla activa">Bases de cotización</div>
                <div class="pestana-tabla deshabilitada">Pensiones<span class="nota-futuro">(próximamente)</span></div>
                <div class="pestana-tabla deshabilitada">Afiliación<span class="nota-futuro">(próximamente)</span></div>
            </div>

            <div class="card">
                <div id="recuentos"></div>
                <div class="controles">
                    <label>Eje X:
                        <select id="select-eje-x" onchange="cambiarEjeX(this.value)">
                            <option value="anos_vl">Años de vida laboral</option>
                            <option value="edad">Edad</option>
                        </select>
                    </label>
                    <div class="switch-vista" id="switch-estadistico">
                        <button type="button" class="activa" data-valor="media" onclick="cambiarEstadistico('media')">Media</button>
                        <button type="button" data-valor="mediana" onclick="cambiarEstadistico('mediana')">Mediana</button>
                    </div>
                </div>
                <div id="grafico-bases"></div>
            </div>
        </div>
    </main>

<script>
const ORDEN_SUBGRUPOS = ["filtro1_si__filtro2_si", "filtro1_si__filtro2_no",
                          "filtro1_no__filtro2_si", "filtro1_no__filtro2_no"];

// Misma paleta e identidad color->subcolectivo que /colectivos (COLOR_SUBGRUPO
// en colectivos.html) - un mismo subcolectivo debe verse del mismo color en
// toda la app.
const COLOR_SUBGRUPO = {
    filtro1_si__filtro2_si: '#00815A',
    filtro1_si__filtro2_no: '#2C6CB0',
    filtro1_no__filtro2_si: '#C9A700',
    filtro1_no__filtro2_no: '#8A4E9E',
};

// Por debajo de esto, la media/mediana de ese punto es poco fiable - se
// corta la linea ahi en vez de seguir dibujando (opcion elegida sobre
// atenuar: mas simple y evita lineas con tramos de fiabilidad distinta
// dificiles de leer). El propio N (todos los puntos, incluidos los
// descartados) se ve como referencia en el eje secundario.
const N_MINIMO = 30;

let ultimoResultado = null;
let ejeX = 'anos_vl';
let estadistico = 'media';

function agruparMiles(digitos) {
    return digitos.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
}

function fmtEntero(n) {
    if (n === null || n === undefined) return '';
    const num = Math.round(Number(n));
    const signo = num < 0 ? '-' : '';
    return signo + agruparMiles(Math.abs(num).toString());
}

function mostrarSinColectivo() {
    document.getElementById('sin-colectivo').style.display = 'flex';
    document.getElementById('con-colectivo').style.display = 'none';
}

function renderizarRecuentos() {
    const cont = document.getElementById('recuentos');
    cont.innerHTML = ORDEN_SUBGRUPOS.map(nombre => {
        const s = ultimoResultado[nombre];
        return `<div class="item"><span class="swatch" style="background:${COLOR_SUBGRUPO[nombre]}"></span>
                ${s.etiqueta} <span class="n">${fmtEntero(s.recuento)}</span></div>`;
    }).join('');
}

function cambiarEjeX(valor) {
    ejeX = valor;
    dibujarGrafico();
}

function cambiarEstadistico(valor) {
    estadistico = valor;
    document.querySelectorAll('#switch-estadistico button')
        .forEach(b => b.classList.toggle('activa', b.dataset.valor === valor));
    dibujarGrafico();
}

function dibujarGrafico() {
    const div = document.getElementById('grafico-bases');
    div.innerHTML = '';
    const traces = [];

    for (const nombre of ORDEN_SUBGRUPOS) {
        const serie = ultimoResultado[nombre].series[ejeX];
        if (!serie.length) continue;
        const etiqueta = ultimoResultado[nombre].etiqueta;

        const xFiable = [], yFiable = [];
        for (const p of serie) {
            if (p.n >= N_MINIMO) { xFiable.push(p.x); yFiable.push(p[estadistico]); }
        }
        traces.push({
            type: 'scatter', mode: 'lines+markers', name: etiqueta,
            x: xFiable, y: yFiable,
            line: { color: COLOR_SUBGRUPO[nombre], width: 2.5 },
            marker: { color: COLOR_SUBGRUPO[nombre], size: 5 },
            hovertemplate: `${etiqueta}<br>%{x}: %{y:,.0f} €<extra></extra>`,
        });
        // N de referencia (TODOS los puntos, incluidos los < N_MINIMO ya
        // excluidos de la linea principal) en el eje secundario - deja ver
        // donde y por que se corta la linea de arriba.
        traces.push({
            type: 'scatter', mode: 'lines', name: 'N ' + etiqueta, showlegend: false,
            x: serie.map(p => p.x), y: serie.map(p => p.n),
            yaxis: 'y2', opacity: 0.4,
            line: { color: COLOR_SUBGRUPO[nombre], width: 1, dash: 'dot' },
            hovertemplate: `N: %{y}<extra></extra>`,
        });
    }

    Plotly.newPlot(div, traces, {
        margin: { l: 60, r: 55, t: 15, b: 45 },
        xaxis: { title: ejeX === 'anos_vl' ? 'Años de vida laboral' : 'Edad' },
        yaxis: { title: 'Bases anuales (€)', rangemode: 'tozero' },
        yaxis2: { title: 'N', overlaying: 'y', side: 'right', rangemode: 'tozero', showgrid: false },
        legend: { orientation: 'h', y: -0.2 },
        font: { family: 'Nunito Sans, Calibri, sans-serif', color: '#1A2E26' },
        paper_bgcolor: '#FFFFFF', plot_bgcolor: '#FFFFFF',
    }, { displayModeBar: false, responsive: true });
}

async function mostrarColectivo(cuerpo) {
    document.getElementById('sin-colectivo').style.display = 'none';
    document.getElementById('con-colectivo').style.display = 'flex';
    // Union CA+CP sobre toda Bases de cotizacion (~32M filas) x 4 subgrupos:
    // tarda del orden de 20-30s, nada instantaneo - sin este aviso la pagina
    // se queda en blanco todo ese tiempo sin explicar por que.
    document.getElementById('grafico-bases').innerHTML = '<p class="aviso-vacio">Calculando trayectorias del colectivo… puede tardar un rato (recorre toda la tabla de Bases de cotización).</p>';

    const resp = await fetch('/trayectorias/colectivo/bases', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(cuerpo),
    });
    if (!resp.ok) {
        document.getElementById('grafico-bases').innerHTML =
            '<p class="aviso-vacio">Error al calcular: ' + await resp.text() + '</p>';
        return;
    }
    ultimoResultado = await resp.json();
    renderizarRecuentos();
    dibujarGrafico();
}

function init() {
    const params = new URLSearchParams(window.location.search);
    const raw = params.get('colectivo');
    if (!raw) { mostrarSinColectivo(); return; }
    let cuerpo;
    try { cuerpo = JSON.parse(raw); } catch (e) { mostrarSinColectivo(); return; }
    mostrarColectivo(cuerpo);
}

init();
</script>
</body>
</html>
